# lakefile.toml                                                      -*-toml-*-
# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# The Lean side of the repository: the model, its tests, and the two tools
# (citation index, C++ emitter). The C++ side is driven by CMake from the
# same root; the Makefile ties the two together.

name = "overload"
defaultTargets = ["Overload"]
testDriver = "OverloadTest"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.35.0"

[[lean_lib]]
name = "Overload"

[[lean_lib]]
name = "OverloadTest"

[[lean_exe]]
name = "citations"
root = "Tools.Citations"
supportInterpreter = true

[[lean_exe]]
name = "emit"
root = "Tools.Emit"
supportInterpreter = true
